name: isentataxi-prod
services:
  app:
    image: ghcr.io/comeca-ai/isentataxi:${IMAGE_TAG:-selfhost}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 400m
    cpus: "0.60"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: isentataxi
      MYSQL_USER: isentataxi
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 450m
    cpus: "0.40"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mysql_data:
