    <title>Despacha.Ai — Gestão de isenções para despachantes</title>
  <script>
/* limpa service workers/caches de versões antigas do app */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){
    if (regs.length) {
      regs.forEach(function(r){ r.unregister(); });
      if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
      if (!sessionStorage.getItem('sw-cleared')) { sessionStorage.setItem('sw-cleared','1'); location.reload(); }
    }
  });
}
</script></head>
